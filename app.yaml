alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: paia
    match:
      path:
        prefix: /paia
  - component:
      name: website
    cors:
      allow_origins:
      - prefix: *
    match:
      path:
        prefix: /
name: paia
region: nyc
services:
- environment_slug: go
  github:
    branch: main
    deploy_on_push: true
    repo: PavelPerna/paia
  http_port: 8080
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: paia
  run_command: bin/paia
  source_dir: /
static_sites:
- environment_slug: html
  github:
    branch: master
    deploy_on_push: true
    repo: git-user-name/website
  name: website
  source_dir: /
